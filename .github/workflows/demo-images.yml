# Собирает образы демо-стенда и кладёт их в ghcr.io, чтобы не собирать на общей ноде.
# Запуск вручную или после изменений в backend/frontend на main.
name: Demo images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/demo-images.yml"

permissions:
  contents: read
  packages: write

env:
  # Адрес, который браузер видит у стенда. Вшивается во фронтенд при сборке.
  DEMO_URL: https://demo.ciferkaservice.online:8443

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/sadrieff/skillpath-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/sadrieff/skillpath-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.DEMO_URL }}
            NEXT_PUBLIC_DEMO=1
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
